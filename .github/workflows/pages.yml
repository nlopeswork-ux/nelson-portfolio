name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# actions/deploy-pages needs pages:write (to publish) and id-token:write
# (to mint the OIDC token it deploys with) — without this block the job
# fails immediately in "Set up job", before any step runs, because the
# default GITHUB_TOKEN doesn't carry those scopes.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments share one target — a second run starting mid-deploy
# must wait, not race the first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Add custom domain
        run: echo "nnlopespt.space" > docs/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
